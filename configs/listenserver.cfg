// ===========================================================
//  Arcade DM — configuracion de ejemplo para servidor local
//  Copia estas lineas a tu cstrike/listenserver.cfg
// ===========================================================

// --- ritmo de deathmatch ---
mp_freezetime 0
mp_roundtime 9
mp_timelimit 30
mp_autoteambalance 1
mp_limitteams 2
mp_startmoney 16000

// --- FFA (el plugin compensa el dano; esto quita los castigos) ---
mp_friendlyfire 1
mp_autokick 0
mp_tkpunish 0

// --- bots YaPB (CS 1.6) ---
// bot_difficulty se ajusta solo si adm_adaptive_bots esta en 1
yb_quota 12
yb_difficulty 0
yb_csdm_mode 2          // FFA: los bots atacan a todo el mundo
yb_join_after_player 0

// --- bots nativos (Condition Zero) ---
// bot_quota 12
// bot_difficulty 1
// bot_join_after_player 0

// --- opciones del mod (todas en 1 por defecto) ---
