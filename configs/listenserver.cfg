// ===========================================================
//  Arcade DM -- example configuration for a local server
//  Copy these lines into your cstrike/listenserver.cfg
// ===========================================================

// --- deathmatch pacing ---
mp_freezetime 0
mp_roundtime 9
mp_timelimit 30
mp_autoteambalance 1
mp_limitteams 2
mp_startmoney 16000

// --- FFA (the plugin scales the damage; these remove the punishments) ---
mp_friendlyfire 1
mp_autokick 0
mp_tkpunish 0

// --- YaPB bots (CS 1.6) ---
// yb_difficulty is adjusted automatically while adm_adaptive_bots is 1
yb_quota 12
yb_difficulty 0
yb_csdm_mode 2          // FFA: bots attack everyone
yb_join_after_player 0

// --- native bots (Condition Zero) ---
// bot_quota 12
// bot_difficulty 1
// bot_join_after_player 0

// --- mod options (all default to 1) ---
